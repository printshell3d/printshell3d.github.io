<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PrintShell3d | Redes Sociales</title>

<!-- Favicon: avatar del logo -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='50' fill='%23101828'/%3E%3Cg transform='translate(17 17) scale(.66)'%3E%3Cpolygon points='50,4 90,27 90,73 50,96 10,73 10,27' fill='%232DE0D2'/%3E%3Cpath d='M28 58 A22 22 0 0 1 72 58' fill='none' stroke='%23101828' stroke-width='6' stroke-linecap='round'/%3E%3Crect x='23' y='54' width='11' height='22' rx='5.5' fill='%23101828'/%3E%3Crect x='66' y='54' width='11' height='22' rx='5.5' fill='%23101828'/%3E%3C/g%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* Paleta tomada del logo (versión 1) */
:root{
  --cyan:#2DE0D2;
  --teal:#0A9A91;
  --teal-deep:#07766f;
  --tint:#d9f8f5;
  --dark:#101828;
  --ink:#101828;
  --muted:#64748b;
  --light:#f8fafc;
  --white:#fff;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Urbanist',sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 80% 10%,var(--tint) 0,transparent 35%),
    var(--light);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px 0;
}

.container{
  width:min(600px,92%);
  text-align:center;
}

/* LOGO VERTICAL */

.logo-v{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  margin-bottom:30px;
}

.ico{
  --hex:var(--dark);
  --band:#fff;
  --cup:var(--teal);
  display:block;
}

.wordmark{
  font-family:'Space Grotesk','Urbanist',sans-serif;
  font-weight:700;
  letter-spacing:-.03em;
  line-height:1;
  font-size:2rem;
  color:var(--dark);
}
.wordmark b{color:var(--teal);font-weight:700}

/* TARJETA */

.card{
  background:#fff;
  padding:45px 35px;
  border-radius:28px;
  border-top:4px solid var(--cyan);
  box-shadow:0 20px 50px #10182818;
}

.kicker{
  color:var(--teal-deep);
  text-transform:uppercase;
  letter-spacing:2px;
  font-size:.76rem;
  font-weight:800;
  margin-bottom:10px;
}

h1{
  color:var(--dark);
  font-size:2.5rem;
  letter-spacing:-.035em;
  line-height:1.1;
  margin-bottom:12px;
}

h1 span{color:var(--teal)}

p{
  color:var(--muted);
  margin-bottom:30px;
}

/* REDES */

.social{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.social a{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  padding:16px;
  border-radius:14px;
  text-decoration:none;
  font-weight:700;
  transition:.2s;
}

.facebook{background:#1877F2;color:#fff}
.instagram{background:#E1306C;color:#fff}

.social a:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 25px #10182822;
}

/* VOLVER */

.back{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin-top:28px;
  padding:13px 20px;
  border-radius:12px;
  background:var(--cyan);
  color:var(--dark);
  text-decoration:none;
  font-weight:700;
  box-shadow:0 10px 25px #2de0d233;
  transition:.2s;
}

.back:hover{
  transform:translateY(-2px);
  box-shadow:0 14px 30px #2de0d255;
}

@media(max-width:520px){
  h1{font-size:2.1rem}
  .card{padding:35px 22px}
}

</style>
</head>

<body>

<!-- Símbolo del ícono -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="ps-icon" viewBox="0 0 100 100">
    <polygon points="50,4 90,27 90,73 50,96 10,73 10,27" fill="var(--hex)"/>
    <path d="M28 58 A22 22 0 0 1 72 58" fill="none" stroke="var(--band)" stroke-width="6" stroke-linecap="round"/>
    <rect x="23" y="54" width="11" height="22" rx="5.5" fill="var(--cup)"/>
    <rect x="66" y="54" width="11" height="22" rx="5.5" fill="var(--cup)"/>
  </symbol>
</svg>

<div class="container">

  <!-- LOGO VERTICAL -->
  <div class="logo-v" role="img" aria-label="PrintShell3d">
    <svg class="ico" width="92" height="92" aria-hidden="true"><use href="#ps-icon"/></svg>
    <span class="wordmark">PrintShell<b>3d</b></span>
  </div>

  <div class="card">

    <div class="kicker">Síguenos</div>

    <h1>Conoce <span>PrintShell3d</span></h1>

    <p>
      Encuentra nuestros diseños, novedades y proyectos
      en nuestras redes sociales.
    </p>

    <div class="social">

      <a class="facebook"
         href="https://www.facebook.com/print.shell3d"
         target="_blank" rel="noopener">
        Facebook
      </a>

      <a class="instagram"
         href="https://www.instagram.com/print_shell3d?utm_source=qr&stkn=MTB3ZmNsNmJ2cHowMg%3D%3D"
         target="_blank" rel="noopener">
        Instagram
      </a>

    </div>

    <a class="back" href="index.html">
      ← Regresar a PrintShell3d
    </a>

  </div>

</div>

</body>
</html>
