<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">

<title>Página no encontrada | PrintShell3d</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='50' fill='%23101828'/%3E%3Cg transform='translate(17 17) scale(.66)'%3E%3Cpolygon points='50,4 90,27 90,73 50,96 10,73 10,27' fill='%232DE0D2'/%3E%3Ccircle cx='35' cy='38' r='11.5' fill='%23101828'/%3E%3Crect x='38.5' y='42' width='8' height='31' rx='4' fill='%23101828'/%3E%3Ccircle cx='65' cy='62' r='11.5' fill='%23101828'/%3E%3Crect x='53.5' y='27' width='8' height='31' rx='4' fill='%23101828'/%3E%3C/g%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --cyan:#2DE0D2;
  --teal:#0A9A91;
  --teal-deep:#07766f;
  --tint:#d9f8f5;
  --dark:#101828;
  --muted:#64748b;
  --light:#f8fafc;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Urbanist',sans-serif;
  color:var(--dark);
  background:
    radial-gradient(circle at 80% 10%,var(--tint) 0,transparent 35%),
    var(--light);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px 0;
}

.container{
  width:min(520px,92%);
  text-align:center;
}

/* Logo horizontal (ícono + nombre, sin imágenes externas) */
.logo-h{display:flex;justify-content:center;margin-bottom:30px}
.logo-h a{display:flex;align-items:center;gap:12px;text-decoration:none}
.ico{
  --hex:var(--dark);
  --band:#fff;
  --cup:var(--teal);
  display:block;
  flex:none;
}
.wordmark{
  font-family:'Space Grotesk','Urbanist',sans-serif;
  font-weight:700;
  letter-spacing:-.03em;
  line-height:1;
  font-size:2rem;
  color:var(--dark);
}
.wordmark b{color:var(--teal);font-weight:700}

.card{
  background:#fff;
  padding:45px 35px;
  border-radius:28px;
  border-top:4px solid var(--cyan);
  box-shadow:0 20px 50px #10182818;
}

.code{
  font-size:5.5rem;
  font-weight:800;
  letter-spacing:-.05em;
  line-height:1;
  color:var(--teal);
  margin-bottom:10px;
}

.kicker{
  color:var(--teal-deep);
  text-transform:uppercase;
  letter-spacing:2px;
  font-size:.76rem;
  font-weight:800;
  margin-bottom:10px;
}

h1{
  font-size:1.9rem;
  letter-spacing:-.03em;
  line-height:1.15;
  margin-bottom:12px;
}

p{
  color:var(--muted);
  margin-bottom:28px;
}

.btns{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  justify-content:center;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:13px 20px;
  border-radius:12px;
  text-decoration:none;
  font-weight:700;
  transition:.2s;
}

.btn.primary{
  background:var(--cyan);
  color:var(--dark);
  box-shadow:0 10px 25px #2de0d233;
}

.btn.secondary{
  background:var(--dark);
  color:#fff;
}

.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 14px 30px #10182822;
}

@media(max-width:520px){
  .card{padding:35px 22px}
  .code{font-size:4.5rem}
  h1{font-size:1.6rem}
  .wordmark{font-size:1.6rem}
}
</style>
</head>

<body>

<!-- Símbolo del ícono -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="ps-icon" viewBox="0 0 100 100">
    <polygon points="50,4 90,27 90,73 50,96 10,73 10,27" fill="var(--hex)"/>
    <circle cx="35" cy="38" r="11.5" fill="var(--band)"/>
    <rect x="38.5" y="42" width="8" height="31" rx="4" fill="var(--band)"/>
    <circle cx="31" cy="36.5" r="3" fill="var(--cup)"/>
    <circle cx="65" cy="62" r="11.5" fill="var(--band)"/>
    <rect x="53.5" y="27" width="8" height="31" rx="4" fill="var(--band)"/>
    <circle cx="69" cy="63.5" r="3" fill="var(--cup)"/>
  </symbol>
</svg>

<div class="container">

  <div class="logo-h">
    <a href="/" aria-label="PrintShell3d, ir al inicio">
      <svg class="ico" width="52" height="52" aria-hidden="true"><use href="#ps-icon"/></svg>
      <span class="wordmark">PrintShell<b>3d</b></span>
    </a>
  </div>

  <div class="card">
    <div class="code">404</div>
    <div class="kicker">Página no encontrada</div>
    <h1>Esta página no existe</h1>
    <p>
      Puede que el enlace esté mal escrito o que la página<br>      ya no esté disponible.
    </p>

    <div class="btns">
      <a class="btn primary" href="/">Ir al inicio</a>
      <a class="btn secondary" href="/redes.html#formulario">Solicitar cotización</a>
    </div>
  </div>

</div>

</body>
</html>
